<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Process Server Dashboard - LexVerdict</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='login_style.css') }}">
    <style>
        .dashboard-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
            color: white;
            text-align: center;
        }

        .dashboard-logo {
            width: 150px;
            max-width: 80vw;
            margin-bottom: 20px;
        }

        .welcome-message {
            font-size: 1.8rem;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .dashboard-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 90%;
            max-width: 300px;
        }

        .dashboard-buttons form {
            margin: 0;
        }

        .dashboard-buttons .btn {
            width: 100%;
            background-color: #ffcc00;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 12px 0;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .dashboard-buttons .btn:hover {
            background-color: #e6b800;
        }

        @media (min-width: 768px) {
            .welcome-message {
                font-size: 2rem;
            }
            .dashboard-buttons .btn {
                font-size: 1.1rem;
                padding: 14px 0;
            }
        }

        .flash-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(50, 50, 50, 0.9);
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            z-index: 9999;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            animation: fadeOut 4s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; display: none; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <img style="height: 250xp; width: 250px;" src="{{ url_for('static', filename='logo.png') }}" alt="DOJ Logo">
        <div class="welcome-message">Welcome, PS: {{ current_user.person.First_name }}</div>

        <div class="dashboard-buttons">
            <form action="{{ url_for('process_server.subpoena_list') }}">
                <button type="submit" class="btn">View Cases</button>
            </form>
            <form action="{{ url_for('auth.logout') }}" method="get">
                <button type="submit" class="btn">Log Out</button>
            </form>
        </div>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages[-1:] %}
                <div class="flash-toast">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

</body>
</html>
